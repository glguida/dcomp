[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcomp-component"
version = "0.3.0"
description = "Dependency-free Python helpers for DComp component sockets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Guida" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/glguida/dcomp"
Repository = "https://github.com/glguida/dcomp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcomp_component = ["py.typed"]
